name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-launcher:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n setup.sh start.sh
          zsh -n "安装 Council.command" desktop/*.sh
      - name: Build and verify desktop launcher
        run: |
          mkdir -p "$HOME/Desktop"
          ./desktop/build-macos-app.sh
          plutil -lint "$HOME/Desktop/Council.app/Contents/Info.plist"
          codesign --verify --deep --strict "$HOME/Desktop/Council.app"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Windows launchers
        shell: pwsh
        run: |
          Get-ChildItem desktop/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          @("Install Council.cmd", "Start Council.cmd", "Stop Council.cmd") | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing Windows entry point: $_" }
          }
          ./desktop/install-windows.ps1 -CheckOnly
      - name: Install and smoke-test Windows launcher
        shell: pwsh
        run: |
          ./desktop/install-windows.ps1 -NoLaunch
          ./desktop/start-council.ps1 -NoBrowser
          $health = Invoke-RestMethod -Uri http://127.0.0.1:8001/api/health
          if ($health.status -ne "ok" -or $health.service -ne "council-lab") { throw "Backend health check failed" }
          $frontendHealth = Invoke-RestMethod -Uri http://127.0.0.1:3000/mobile-access/health
          if ($frontendHealth.status -ne "ok" -or $frontendHealth.service -ne "council-mobile-access") { throw "Frontend smoke test failed" }
          $pidFile = Join-Path $env:LOCALAPPDATA "Council\logs\council-pids.json"
          $first = Get-Content -Raw $pidFile | ConvertFrom-Json
          ./desktop/start-council.ps1 -NoBrowser
          $repeat = Get-Content -Raw $pidFile | ConvertFrom-Json
          if ($first.backend -ne $repeat.backend -or $first.frontend -ne $repeat.frontend) { throw "Repeated launch replaced healthy processes" }
          ./desktop/stop-council.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend:. pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          COUNCIL_DATA_DIR="$RUNNER_TEMP/council-data" python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8001 >"$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/backend.pid"
          (cd frontend && exec node_modules/.bin/next dev --hostname 127.0.0.1) >"$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/frontend.pid"
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:8001/api/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"
          exit 1
        working-directory: .
      - run: npm test
        working-directory: frontend
      - name: Verify mobile pairing guard and same-origin API
        run: |
          kill "$(cat "$RUNNER_TEMP/frontend.pid")" 2>/dev/null || true
          wait "$(cat "$RUNNER_TEMP/frontend.pid")" 2>/dev/null || true
          for attempt in {1..40}; do
            curl -fsS http://127.0.0.1:3000/mobile-access/health >/dev/null 2>&1 || break
            sleep 0.25
          done
          ! curl -fsS http://127.0.0.1:3000/mobile-access/health >/dev/null 2>&1
          (cd frontend && COUNCIL_REMOTE_TOKEN=ci-mobile-token exec node_modules/.bin/next dev --hostname 0.0.0.0) >"$RUNNER_TEMP/frontend-mobile.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/frontend.pid"
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:3000/mobile-access/health >/dev/null && break
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "403"
          cookie_jar="$(mktemp "$RUNNER_TEMP/council-cookie.XXXXXX")"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{\"token\":\"wrong\"}' http://127.0.0.1:3000/mobile-access/pair)" = "403"
          curl -fsS -c "$cookie_jar" -H 'Content-Type: application/json' --data '{"token":"ci-mobile-token"}' http://127.0.0.1:3000/mobile-access/pair | grep -q '"paired":true'
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/ | grep -q Council
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/api/health | grep -q council-lab
          test "$(curl -sS -b "$cookie_jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/mobile-access/info)" = "403"
          desktop_cookie="$(mktemp "$RUNNER_TEMP/council-desktop-cookie.XXXXXX")"
          curl -fsS -c "$desktop_cookie" -H 'Content-Type: application/json' --data '{"token":"ci-mobile-token","device":"desktop"}' http://127.0.0.1:3000/mobile-access/pair | grep -q '"paired":true'
          curl -fsS -b "$desktop_cookie" http://127.0.0.1:3000/mobile-access/info | grep -q '"pairUrl"'
      - if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/backend.pid")" "$(cat "$RUNNER_TEMP/frontend.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log" "$RUNNER_TEMP/frontend-mobile.log" 2>/dev/null || true
