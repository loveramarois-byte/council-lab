name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          python scripts/check_release_consistency.py
      - run: python -m pip install -r backend/requirements.lock
      - name: Backend tests, privacy regression, and coverage gate
        run: PYTHONPATH=backend:. pytest -q backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=72
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  macos:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.lock "pyinstaller>=6.11,<7"
      - name: Test macOS launcher ownership guards
        run: python -m pytest backend/tests/test_release_consistency.py -k macos_launcher
      - name: Build self-contained macOS app
        env:
          PYTHON_BIN: python
        run: ./packaging/build-macos-release.sh
      - name: Smoke-test launcher repeat and partial recovery
        run: |
          package="$GITHUB_WORKSPACE/artifacts/Council-v$(tr -d '[:space:]' < VERSION)-macOS"
          resources="$package/Council.app/Contents/Resources"
          export COUNCIL_DATA_DIR="$RUNNER_TEMP/launcher-data"
          export COUNCIL_LOG_DIR="$RUNNER_TEMP/launcher-logs"
          export COUNCIL_NO_BROWSER=1
          launcher="$resources/launcher/start-council.sh"
          stopper="$resources/launcher/stop-council.sh"
          cleanup() {
            "$stopper" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          version="$(tr -d '[:space:]' < VERSION)"
          stale_version="0.0.0"
          app_root="$(cd "$resources/../.." && pwd -P)"
          stale_runtime="macos:$(printf '%s\0%s' "$app_root" "$stale_version" | shasum -a 256 | awk '{print substr($1, 1, 24)}')"
          export COUNCIL_PACKAGED=1
          export COUNCIL_INSTALL_ROOT="$app_root"
          export COUNCIL_VERSION="$stale_version"
          export COUNCIL_RUNTIME_ID="$stale_runtime"
          export COUNCIL_REMOTE_TOKEN="stale-mobile-token"
          export COUNCIL_DESKTOP_TOKEN="stale-desktop-token"
          "$resources/backend/council-backend/council-backend" >>"$RUNNER_TEMP/stale-backend.log" 2>&1 &
          stale_backend=$!
          pushd "$resources/web" >/dev/null
          HOSTNAME=127.0.0.1 PORT=3000 NODE_ENV=production "$resources/runtime/node" server.js >>"$RUNNER_TEMP/stale-frontend.log" 2>&1 &
          stale_frontend=$!
          popd >/dev/null
          mkdir -p "$COUNCIL_LOG_DIR"
          printf 'backend %s\nfrontend %s\n' "$stale_backend" "$stale_frontend" > "$COUNCIL_LOG_DIR/council-bundled.pids"
          stale_healthy=0
          for attempt in {1..80}; do
            backend_stale="$(curl -fsS http://127.0.0.1:8001/api/health 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("runtime_id", ""))' 2>/dev/null || true)"
            frontend_stale="$(curl -fsS http://127.0.0.1:3000/mobile-access/health 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("runtime_id", ""))' 2>/dev/null || true)"
            if [[ "$backend_stale" == "$stale_runtime" && "$frontend_stale" == "$stale_runtime" ]]; then stale_healthy=1; break; fi
            sleep 0.25
          done
          test "$stale_healthy" = 1
          "$launcher"
          ! kill -0 "$stale_backend" 2>/dev/null
          ! kill -0 "$stale_frontend" 2>/dev/null
          backend_runtime="$(curl -fsS http://127.0.0.1:8001/api/health | python -c 'import json,sys; print(json.load(sys.stdin)["runtime_id"])')"
          frontend_runtime="$(curl -fsS http://127.0.0.1:3000/mobile-access/health | python -c 'import json,sys; print(json.load(sys.stdin)["runtime_id"])')"
          [[ "$backend_runtime" == macos:* ]]
          test "$backend_runtime" = "$frontend_runtime"
          test "$(curl -fsS http://127.0.0.1:8001/api/update/status | python -c 'import json,sys; print(json.load(sys.stdin)["current_version"])')" = "$version"
          curl -fsS http://127.0.0.1:3000/mobile-access/health | grep -q council-mobile-access
          node scripts/check_frontend_assets.mjs http://127.0.0.1:3000/pair
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "403"
          token="$(tr -d '[:space:]' < "$COUNCIL_LOG_DIR/mobile-access.token")"
          desktop_token="$(tr -d '[:space:]' < "$COUNCIL_LOG_DIR/desktop-access.token")"
          cookie_jar="$RUNNER_TEMP/launcher-cookie.txt"
          curl -fsS -c "$cookie_jar" -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data "{\"token\":\"$token\"}" http://127.0.0.1:3000/mobile-access/pair | grep -q '"paired":true'
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/ | grep -q Council
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/api/health | grep -q council-lab
          mobile_desktop_status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data "{\"token\":\"$token\",\"device\":\"desktop\"}" http://127.0.0.1:3000/mobile-access/pair)"
          [[ "$mobile_desktop_status" == "403" ]]
          desktop_cookie="$RUNNER_TEMP/launcher-desktop-cookie.txt"
          curl -fsS -c "$desktop_cookie" -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data "{\"token\":\"$desktop_token\",\"device\":\"desktop\"}" http://127.0.0.1:3000/mobile-access/pair | grep -q '"paired":true'
          curl -fsS -b "$desktop_cookie" http://127.0.0.1:3000/mobile-access/info | grep -q '"activeSessions":1'
          first_backend="$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          first_frontend="$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test -n "$first_backend"
          test -n "$first_frontend"
          "$launcher"
          test "$first_backend" = "$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test "$first_frontend" = "$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          kill "$first_frontend"
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:3000/mobile-access/health >/dev/null 2>&1 || break; sleep 0.1; done
          "$launcher"
          second_backend="$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          second_frontend="$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test "$first_backend" = "$second_backend"
          test "$first_frontend" != "$second_frontend"
          "$stopper"
          services_stopped=0
          for attempt in {1..40}; do
            if ! kill -0 "$second_backend" 2>/dev/null \
              && ! kill -0 "$second_frontend" 2>/dev/null \
              && ! curl -fsS http://127.0.0.1:8001/api/health >/dev/null 2>&1 \
              && ! curl -fsS http://127.0.0.1:3000/mobile-access/health >/dev/null 2>&1; then
              services_stopped=1
              break
            fi
            sleep 0.1
          done
          test "$services_stopped" = 1
          ! kill -0 "$second_backend" 2>/dev/null
          ! kill -0 "$second_frontend" 2>/dev/null
      - name: Smoke-test verified macOS replacement helper
        run: |
          package="$GITHUB_WORKSPACE/artifacts/Council-v$(tr -d '[:space:]' < VERSION)-macOS"
          target="$RUNNER_TEMP/Council.app"
          /usr/bin/ditto "$package/Council.app" "$target"
          echo "0.0.0" > "$target/Contents/Resources/VERSION"
          export COUNCIL_UPDATE_NO_RESTART=1
          /bin/zsh "$package/Council.app/Contents/Resources/launcher/update-council.sh" \
            "$package/Council.app" "$target" \
            "$target/Contents/Resources/launcher/stop-council.sh" \
            "$RUNNER_TEMP/update.log" "$RUNNER_TEMP/update-result.json"
          test "$(tr -d '[:space:]' < "$target/Contents/Resources/VERSION")" = "$(tr -d '[:space:]' < VERSION)"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/update-result.json")" = "success"
          codesign --verify --deep --strict "$target"
      - uses: actions/upload-artifact@v4
        with:
          name: council-macos
          path: artifacts/Council-v*-macOS.zip
          if-no-files-found: error

  windows:
    needs: verify-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.lock "pyinstaller>=6.11,<7"
      - name: Build self-contained Windows package
        shell: pwsh
        run: ./packaging/build-windows-release.ps1
      - name: Smoke-test packaged services
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = Join-Path $PWD "artifacts\Council-v$version-Windows"
          $env:COUNCIL_DATA_DIR = Join-Path $env:RUNNER_TEMP "council-data"
          $backend = Start-Process -FilePath (Join-Path $package "backend\council-backend\council-backend.exe") -PassThru -WindowStyle Hidden
          $oldHost = $env:HOSTNAME
          $oldPort = $env:PORT
          $env:HOSTNAME = "127.0.0.1"
          $env:PORT = "3000"
          $frontend = Start-Process -FilePath (Join-Path $package "runtime\node.exe") -ArgumentList "server.js" -WorkingDirectory (Join-Path $package "web") -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8001/api/health -TimeoutSec 2
                $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/ -TimeoutSec 2
                if ($health.status -eq "ok" -and $page.Content -match "Council") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $healthy) { throw "Packaged services did not become healthy" }
            & node scripts/check_frontend_assets.mjs http://127.0.0.1:3000/pair
            if ($LASTEXITCODE -ne 0) { throw "Packaged frontend assets failed validation" }
          } finally {
            Stop-Process -Id $backend.Id, $frontend.Id -Force -ErrorAction SilentlyContinue
            if ($null -eq $oldHost) { Remove-Item Env:HOSTNAME -ErrorAction SilentlyContinue } else { $env:HOSTNAME = $oldHost }
            if ($null -eq $oldPort) { Remove-Item Env:PORT -ErrorAction SilentlyContinue } else { $env:PORT = $oldPort }
          }
      - name: Smoke-test launcher repeat and partial recovery
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = Join-Path $PWD "artifacts\Council-v$version-Windows"
          $launcher = Join-Path $package "runtime\start-council.ps1"
          $stopper = Join-Path $package "runtime\stop-council.ps1"
          $env:COUNCIL_DATA_DIR = Join-Path $env:RUNNER_TEMP "launcher-data"
          $env:COUNCIL_LOG_DIR = Join-Path $env:RUNNER_TEMP "launcher-logs"
          $env:COUNCIL_PACKAGED = "1"
          $env:COUNCIL_INSTALL_ROOT = $package
          $env:COUNCIL_VERSION = "0.0.0"
          $resolvedPackage = (Resolve-Path $package).Path
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $runtimeSeed = "$resolvedPackage$([char]0)$($env:COUNCIL_VERSION)"
            $runtimeHash = [BitConverter]::ToString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($runtimeSeed))).Replace("-", "").ToLowerInvariant()
          } finally { $hasher.Dispose() }
          $staleRuntime = "windows:$($runtimeHash.Substring(0, 24))"
          $env:COUNCIL_RUNTIME_ID = $staleRuntime
          $env:COUNCIL_REMOTE_TOKEN = "stale-mobile-token"
          $env:COUNCIL_DESKTOP_TOKEN = "stale-desktop-token"
          $env:HOSTNAME = "127.0.0.1"
          $env:PORT = "3000"
          $env:NODE_ENV = "production"
          $staleBackend = Start-Process -FilePath (Join-Path $package "backend\council-backend\council-backend.exe") -WorkingDirectory $package -WindowStyle Hidden -PassThru
          $staleFrontend = Start-Process -FilePath (Join-Path $package "runtime\node.exe") -ArgumentList @("server.js") -WorkingDirectory (Join-Path $package "web") -WindowStyle Hidden -PassThru
          $staleHealthy = $false
          for ($attempt = 0; $attempt -lt 80; $attempt++) {
            try {
              $staleHealth = Invoke-RestMethod http://127.0.0.1:8001/api/health -TimeoutSec 2
              $staleWeb = Invoke-RestMethod http://127.0.0.1:3000/mobile-access/health -TimeoutSec 2
              if ($staleHealth.runtime_id -eq $staleRuntime -and $staleWeb.runtime_id -eq $staleRuntime) { $staleHealthy = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $staleHealthy) { throw "Stale runtime fixture did not become healthy" }
          & $launcher -NoBrowser
          if (Get-Process -Id $staleBackend.Id, $staleFrontend.Id -ErrorAction SilentlyContinue) { throw "Launcher did not replace stale Council processes" }
          $backendHealth = Invoke-RestMethod http://127.0.0.1:8001/api/health
          $frontendHealth = Invoke-RestMethod http://127.0.0.1:3000/mobile-access/health
          if ($backendHealth.runtime_id -eq $staleRuntime -or $backendHealth.runtime_id -ne $frontendHealth.runtime_id -or -not $backendHealth.runtime_id.StartsWith("windows:")) {
            throw "Launcher did not establish one matching packaged runtime identity"
          }
          $updateStatus = Invoke-RestMethod http://127.0.0.1:8001/api/update/status
          if ($updateStatus.current_version -ne $version) { throw "Packaged updater reports the wrong current version" }
          $pidFile = Join-Path $env:COUNCIL_LOG_DIR "council-bundled-pids.json"
          $first = Get-Content -Raw $pidFile | ConvertFrom-Json
          & $launcher -NoBrowser
          $repeat = Get-Content -Raw $pidFile | ConvertFrom-Json
          if ($first.backend -ne $repeat.backend -or $first.frontend -ne $repeat.frontend) { throw "Repeated launch replaced healthy processes" }
          Stop-Process -Id $first.frontend -Force
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            try { Invoke-RestMethod http://127.0.0.1:3000/mobile-access/health -TimeoutSec 1 | Out-Null } catch { break }
            Start-Sleep -Milliseconds 100
          }
          & $launcher -NoBrowser
          $recovered = Get-Content -Raw $pidFile | ConvertFrom-Json
          if ($recovered.backend -ne $first.backend) { throw "Healthy backend PID was lost" }
          if ($recovered.frontend -eq $first.frontend) { throw "Dead frontend PID was not replaced" }
          & $stopper
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            if (-not (Get-Process -Id $recovered.backend, $recovered.frontend -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 100
          }
          if (Get-Process -Id $recovered.backend, $recovered.frontend -ErrorAction SilentlyContinue) { throw "Stop launcher left Council processes running" }
      - name: Smoke-test verified Windows replacement helper
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = Join-Path $PWD "artifacts\Council-v$version-Windows"
          $target = Join-Path $env:RUNNER_TEMP "Council"
          Copy-Item -Recurse $package $target
          Set-Content -Encoding ASCII -Path (Join-Path $target "VERSION") -Value "0.0.0"
          Set-Content -Encoding ASCII -Path (Join-Path $target "obsolete.txt") -Value "remove me"
          $env:COUNCIL_UPDATE_NO_RESTART = "1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package "runtime\update-council.ps1") `
            -NewRoot $package -TargetRoot $target -Stopper (Join-Path $target "runtime\stop-council.ps1") `
            -LogFile (Join-Path $env:RUNNER_TEMP "update.log") -ResultFile (Join-Path $env:RUNNER_TEMP "update-result.json")
          if ((Get-Content -Raw (Join-Path $target "VERSION")).Trim() -ne $version) { throw "Windows helper did not install the current version" }
          if (Test-Path (Join-Path $target "obsolete.txt")) { throw "Windows helper did not mirror the release package" }
          if ((Get-Content -Raw (Join-Path $env:RUNNER_TEMP "update-result.json") | ConvertFrom-Json).status -ne "success") { throw "Windows helper did not record success" }

          $rollbackTarget = Join-Path $env:RUNNER_TEMP "Council-rollback"
          Copy-Item -Recurse $package $rollbackTarget
          Set-Content -Encoding ASCII -Path (Join-Path $rollbackTarget "VERSION") -Value "0.0.1"
          Set-Content -Encoding ASCII -Path (Join-Path $rollbackTarget "previous-version.txt") -Value "keep me"
          $lockedSource = Join-Path $package "force-copy-failure.txt"
          Set-Content -Encoding ASCII -Path $lockedSource -Value "this source-only file must be copied"
          $locked = [System.IO.File]::Open($lockedSource, "Open", "Read", "None")
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package "runtime\update-council.ps1") `
              -NewRoot $package -TargetRoot $rollbackTarget -Stopper (Join-Path $rollbackTarget "runtime\stop-council.ps1") `
              -LogFile (Join-Path $env:RUNNER_TEMP "rollback.log") -ResultFile (Join-Path $env:RUNNER_TEMP "rollback-result.json")
            $rollbackExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
          } finally {
            $locked.Dispose()
          }
          if ($rollbackExit -eq 0) { throw "Locked update unexpectedly succeeded" }
          if ((Get-Content -Raw (Join-Path $rollbackTarget "VERSION")).Trim() -ne "0.0.1") { throw "Rollback did not restore the previous version" }
          if (-not (Test-Path (Join-Path $rollbackTarget "previous-version.txt"))) { throw "Rollback lost a previous-version file" }
          $rollbackResult = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "rollback-result.json") | ConvertFrom-Json
          if ($rollbackResult.status -ne "error" -or $rollbackResult.message -notmatch "previous version was restored") { throw "Rollback result was not recorded" }
      - uses: actions/upload-artifact@v4
        with:
          name: council-windows
          path: artifacts/Council-v*-Windows.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: council-*
          merge-multiple: true
          path: artifacts
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_release_notes.py --output artifacts/RELEASE_NOTES.md
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/SHA256SUMS.txt --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Council ${GITHUB_REF_NAME}" --notes-file artifacts/RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Council ${GITHUB_REF_NAME}" \
              --generate-notes \
              --notes-file artifacts/RELEASE_NOTES.md
          fi
