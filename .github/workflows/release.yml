name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build novice-friendly source package
        run: |
          package="Council-${GITHUB_REF_NAME}-macOS.zip"
          git archive --format=zip --prefix="Council-${GITHUB_REF_NAME}/" -o "$package" "$GITHUB_SHA"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" \
            --title "Council ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "面向 macOS 普通用户：下载 Council-${GITHUB_REF_NAME}-macOS.zip，解压后双击‘安装 Council.command’。首次使用需要 Python 3.12+ 和 Node.js 22+。"
