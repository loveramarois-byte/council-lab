name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

  macos:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.lock "pyinstaller>=6.11,<7"
      - name: Build self-contained macOS app
        env:
          PYTHON_BIN: python
        run: ./packaging/build-macos-release.sh
      - name: Smoke-test launcher repeat and partial recovery
        run: |
          package="$GITHUB_WORKSPACE/artifacts/Council-v$(tr -d '[:space:]' < VERSION)-macOS"
          resources="$package/Council.app/Contents/Resources"
          export COUNCIL_DATA_DIR="$RUNNER_TEMP/launcher-data"
          export COUNCIL_LOG_DIR="$RUNNER_TEMP/launcher-logs"
          export COUNCIL_NO_BROWSER=1
          launcher="$resources/launcher/start-council.sh"
          stopper="$resources/launcher/stop-council.sh"
          cleanup() {
            "$stopper" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$launcher"
          curl -fsS http://127.0.0.1:8001/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/ | grep -q Council
          first_backend="$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          first_frontend="$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test -n "$first_backend"
          test -n "$first_frontend"
          "$launcher"
          test "$first_backend" = "$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test "$first_frontend" = "$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          kill "$first_frontend"
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 || break; sleep 0.1; done
          "$launcher"
          second_backend="$(awk '$1 == "backend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          second_frontend="$(awk '$1 == "frontend" {print $2}' "$COUNCIL_LOG_DIR/council-bundled.pids")"
          test "$first_backend" = "$second_backend"
          test "$first_frontend" != "$second_frontend"
          "$stopper"
          services_stopped=0
          for attempt in {1..40}; do
            if ! kill -0 "$second_backend" 2>/dev/null \
              && ! kill -0 "$second_frontend" 2>/dev/null \
              && ! curl -fsS http://127.0.0.1:8001/api/health >/dev/null 2>&1 \
              && ! curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              services_stopped=1
              break
            fi
            sleep 0.1
          done
          test "$services_stopped" = 1
          ! kill -0 "$second_backend" 2>/dev/null
          ! kill -0 "$second_frontend" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: council-macos
          path: artifacts/Council-v*-macOS.zip
          if-no-files-found: error

  windows:
    needs: verify-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.lock "pyinstaller>=6.11,<7"
      - name: Build self-contained Windows package
        shell: pwsh
        run: ./packaging/build-windows-release.ps1
      - name: Smoke-test packaged services
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = Join-Path $PWD "artifacts\Council-v$version-Windows"
          $env:COUNCIL_DATA_DIR = Join-Path $env:RUNNER_TEMP "council-data"
          $backend = Start-Process -FilePath (Join-Path $package "backend\council-backend\council-backend.exe") -PassThru -WindowStyle Hidden
          $oldHost = $env:HOSTNAME
          $oldPort = $env:PORT
          $env:HOSTNAME = "127.0.0.1"
          $env:PORT = "3000"
          $frontend = Start-Process -FilePath (Join-Path $package "runtime\node.exe") -ArgumentList "server.js" -WorkingDirectory (Join-Path $package "web") -PassThru -WindowStyle Hidden
          try {
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8001/api/health -TimeoutSec 2
                $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/ -TimeoutSec 2
                if ($health.status -eq "ok" -and $page.Content -match "Council") { exit 0 }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            throw "Packaged services did not become healthy"
          } finally {
            Stop-Process -Id $backend.Id, $frontend.Id -Force -ErrorAction SilentlyContinue
            if ($null -eq $oldHost) { Remove-Item Env:HOSTNAME -ErrorAction SilentlyContinue } else { $env:HOSTNAME = $oldHost }
            if ($null -eq $oldPort) { Remove-Item Env:PORT -ErrorAction SilentlyContinue } else { $env:PORT = $oldPort }
          }
      - name: Smoke-test launcher repeat and partial recovery
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = Join-Path $PWD "artifacts\Council-v$version-Windows"
          $launcher = Join-Path $package "runtime\start-council.ps1"
          $stopper = Join-Path $package "runtime\stop-council.ps1"
          $env:COUNCIL_DATA_DIR = Join-Path $env:RUNNER_TEMP "launcher-data"
          $env:COUNCIL_LOG_DIR = Join-Path $env:RUNNER_TEMP "launcher-logs"
          & $launcher -NoBrowser
          $pidFile = Join-Path $env:COUNCIL_LOG_DIR "council-bundled-pids.json"
          $first = Get-Content -Raw $pidFile | ConvertFrom-Json
          & $launcher -NoBrowser
          $repeat = Get-Content -Raw $pidFile | ConvertFrom-Json
          if ($first.backend -ne $repeat.backend -or $first.frontend -ne $repeat.frontend) { throw "Repeated launch replaced healthy processes" }
          Stop-Process -Id $first.frontend -Force
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/ -TimeoutSec 1 | Out-Null } catch { break }
            Start-Sleep -Milliseconds 100
          }
          & $launcher -NoBrowser
          $recovered = Get-Content -Raw $pidFile | ConvertFrom-Json
          if ($recovered.backend -ne $first.backend) { throw "Healthy backend PID was lost" }
          if ($recovered.frontend -eq $first.frontend) { throw "Dead frontend PID was not replaced" }
          & $stopper
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            if (-not (Get-Process -Id $recovered.backend, $recovered.frontend -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 100
          }
          if (Get-Process -Id $recovered.backend, $recovered.frontend -ErrorAction SilentlyContinue) { throw "Stop launcher left Council processes running" }
      - uses: actions/upload-artifact@v4
        with:
          name: council-windows
          path: artifacts/Council-v*-Windows.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: council-*
          merge-multiple: true
          path: artifacts
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Council ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "macOS：下载 macOS ZIP，解压后双击 Council.app。Windows：下载 Windows ZIP，完整解压后双击 Start Council.cmd。两个包均内置运行环境，不需要安装 Python 或 Node.js。当前开源构建未做 Apple notarization 或 Windows 商业代码签名，请仅从本仓库 Release 下载。"
